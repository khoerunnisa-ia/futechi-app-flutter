name: futechi
description: Futechi — Smart Poultry Farm. Pemantauan dan pengelolaan peternakan unggas cerdas.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Chat streaming with the /api/chat backend (mirrors @ai-sdk/react usage)
  flutter_markdown: ^0.7.4
  shared_preferences: ^2.3.2
  http: ^1.2.8
  uuid: ^4.5.1
  intl: ^0.19.0
  url_launcher: ^6.3.0
  mqtt_client: ^10.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
