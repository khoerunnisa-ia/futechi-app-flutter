name: futechi
description: Futechi — Smart Poultry Farm. Pemantauan dan pengelolaan peternakan unggas cerdas.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Chat streaming with the /api/chat backend (mirrors @ai-sdk/react usage)
  flutter_markdown: ^0.7.4
  shared_preferences: ^2.3.2
  http: ^1.2.8
  uuid: ^4.5.1
  intl: ^0.19.0
  url_launcher: ^6.3.0
  mqtt_client: ^10.13.0
  # Konfigurasi runtime dari asset `.env` (lihat lib/config/env.dart)
  flutter_dotenv: ^5.2.1
  dotenv: ^4.2.0
  # CCTV live stream — Opsi A: media_kit (libmpv backend, native RTSP TCP low-latency)
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: 1.0.7
  google_fonts: ^8.2.1
  geolocator: ^14.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # Dibaca lewat Env.load() di lib/main.dart.
    # `.env` wajib ada saat build; salin dari `.env.example` bila belum ada.
    - .env
